name: vphub
description: "VP Hub - quet, doc, dieu khien moi thiet bi ESP32 qua BLE (giao thuc VPH v1)."
publish_to: 'none'

version: 1.4.0+6

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  # Ghim 11.x: ban 13.0.2 keo permission_handler_android 14.1.0 khong bien dich
  # duoc voi AGP/Kotlin cua may nay (xem pubspec app lo nung)
  permission_handler: ^11.4.0
  fl_chart: ^1.2.0
  shared_preferences: ^2.5.5
  package_info_plus: ^10.2.1
  file_picker: ^13.1.0
  universal_ble: ^2.3.0
  wakelock_plus: ^1.8.0
  flutter_localizations:
    sdk: flutter
  intl: any
  path_provider: ^2.1.6
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

# Sau khi doi hinh (assets/icon/generate_icon.py): dart run flutter_launcher_icons
# Icon thich ung: nen #0F172A + lop hinh trong vung an toan 66% + lop mot mau (Android 13 themed icon)
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0F172A"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"
  adaptive_icon_monochrome: "assets/icon/icon_mono.png"
  min_sdk_android: 23

# Man khoi dong: dart run flutter_native_splash:create
# Nen #0F172A o ca che do sang va toi, logo giua; Android 12+ dung API splash cua he thong
flutter_native_splash:
  color: "#0F172A"
  image: assets/icon/splash.png
  color_dark: "#0F172A"
  image_dark: assets/icon/splash.png
  android_12:
    color: "#0F172A"
    image: assets/icon/splash_android12.png
    icon_background_color: "#0F172A"
    color_dark: "#0F172A"
    image_dark: assets/icon/splash_android12.png
    icon_background_color_dark: "#0F172A"
  android: true
  ios: false
  web: false

flutter:
  uses-material-design: true
  # Sinh lib/l10n/app_localizations*.dart tu cac file .arb (l10n.yaml)
  generate: true
  assets:
    - assets/demo/
    - assets/legacy/
