name: vphub
description: "VP Hub - quet, doc, dieu khien moi thiet bi ESP32 qua BLE (giao thuc VPH v1)."
publish_to: 'none'

version: 1.3.0+5

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  # Ghim 11.x: ban 13.0.2 keo permission_handler_android 14.1.0 khong bien dich
  # duoc voi AGP/Kotlin cua may nay (xem pubspec app lo nung)
  permission_handler: ^11.4.0
  fl_chart: ^1.2.0
  shared_preferences: ^2.5.5
  package_info_plus: ^10.2.1
  file_picker: ^13.1.0
  universal_ble: ^2.3.0
  wakelock_plus: ^1.8.0
  flutter_localizations:
    sdk: flutter
  intl: any
  path_provider: ^2.1.6
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# Sau khi doi assets/icon/icon.png: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 23

flutter:
  uses-material-design: true
  # Sinh lib/l10n/app_localizations*.dart tu cac file .arb (l10n.yaml)
  generate: true
  assets:
    - assets/demo/
    - assets/legacy/
